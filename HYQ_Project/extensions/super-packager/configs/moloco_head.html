<script>
    window.addEventListener('error', function (event) {
        // 构建错误信息对象
        const errorInfo = {
            message: event.message,
            filename: event.filename,
            lineno: event.lineno,
            colno: event.colno,
            // error堆栈信息通常最有用
            stack: event.error ? event.error.stack : 'No stack trace'
        };

        // 在此处处理错误信息：打印到控制台或发送到服务器
        try {
            window["pba_send_msg"] && window["pba_send_msg"]("game_error", JSON.stringify(errorInfo))
        } catch (error) {
            // console.warn("pba_log error report failed: ", error)
        }
        // console.error('Cocos 发生报错:', errorInfo);
    });
</script>
